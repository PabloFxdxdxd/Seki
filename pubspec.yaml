name: proyect_seki
description: "Proyecto orientado a adatpar hábitos."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  sqlite3_flutter_libs: ^0.5.0 # Necesario para Android/iOS/Desktop
  drift: ^2.32.1
  path_provider: ^2.1.5
  path: ^1.9.1               # Para manejar rutas de archivos
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  bar_chart: ^1.0.0+1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.1
  build_runner: ^2.13.1


flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/icons/